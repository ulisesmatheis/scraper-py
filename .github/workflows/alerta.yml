name: Alerta de Vacantes LinkedIn

on:
  schedule:
    # 9:00 AM Hora del Centro de México (UTC-6) = 15:00 UTC
    # Formato Cron: Minuto Hora DíaMes Mes DíaSemana (1 = Lunes)
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  extraer_y_enviar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas

      - name: Ejecutar script y enviar correo
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DESTINO: "cpmonts14@gmail.com"
          MAIL_CC: "matheisfn@gmail.com"
        run: python scraper.py
